<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How publishing works · Venue Finder STEM</title>
  <meta name="description" content="A beginner's guide: conferences and journals, main track and workshops, proceedings, submission phases, metrics (CORE, SJR, quartiles, CiteScore, Impact Factor), open access, predatory journals and a glossary.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bd6'/%3E%3Cpath d='M9 22l7-12 7 12' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint.
    try { const t = localStorage.getItem("vf-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#content" data-i18n="skip.content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true">▲</span>
        <span><span data-i18n="app.title">Venue Finder STEM</span><small data-i18n="app.tagline">Where to publish: conferences and journals</small></span>
      </a>
      <nav class="main-nav" data-i18n-attr="aria-label:nav.aria" aria-label="Main navigation">
        <a href="./" data-i18n="nav.explore">Explore</a>
        <a href="guide.html" aria-current="page" data-i18n="nav.guide">How publishing works</a>
      </nav>
      <label class="sr-only" for="lang-select" data-i18n="lang.label">Language</label>
      <select id="lang-select" class="lang-select"></select>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Theme">
        <span aria-hidden="true" id="theme-icon">◐</span><span class="lbl" id="theme-label">Auto</span>
      </button>
    </div>
  </header>

  <main class="guide" id="content" aria-live="polite"></main>

  <footer class="site-footer"><p data-i18n="guide.footer">Information based on the sources cited in each section. Always check the rules of the specific venue before submitting.</p></footer>

  <noscript><p style="padding:16px">This page requires JavaScript.</p></noscript>
  <script src="assets/js/time.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script>
    (async function () {
      "use strict";
      await I18N.load();
      document.title = I18N.t("guide.title") + " · " + I18N.t("app.title");

      // Guide content is a static HTML fragment per language, English as fallback.
      const main = document.getElementById("content");
      const get = (code) => fetch("assets/guide/" + code + ".html", { cache: "no-cache" }).then((r) => (r.ok ? r.text() : null)).catch(() => null);
      main.innerHTML = (await get(I18N.lang)) || (await get("en")) || "";
      if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView(); }

      // Theme toggle (same behaviour as the main page).
      const order = ["auto", "light", "dark"], icons = { auto: "◐", light: "☀", dark: "☾" };
      let cur = "auto";
      try { cur = localStorage.getItem("vf-theme") || "auto"; } catch (e) {}
      if (order.indexOf(cur) < 0) cur = "auto";
      const btn = document.getElementById("theme-btn");
      function apply() {
        if (cur === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = cur;
        const name = I18N.t("theme." + cur);
        document.getElementById("theme-label").textContent = name;
        document.getElementById("theme-icon").textContent = icons[cur];
        btn.setAttribute("aria-label", I18N.t("theme.aria", { name: name }));
      }
      apply();
      btn.addEventListener("click", function () {
        cur = order[(order.indexOf(cur) + 1) % order.length];
        try { if (cur === "auto") localStorage.removeItem("vf-theme"); else localStorage.setItem("vf-theme", cur); } catch (e) {}
        apply();
      });
    })();
  </script>
</body>
</html>
